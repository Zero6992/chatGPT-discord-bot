services:
  bot:
    build: .
    env_file: .env
    environment:
      BOT_CONFIG: /app/config.toml
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
