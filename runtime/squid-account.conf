# Personal CLI account login/inference only. No wildcards or arbitrary egress.
http_port 3128
acl CONNECT method CONNECT
acl TLS port 443
acl account_services dstdomain auth.openai.com chatgpt.com api.anthropic.com claude.ai claude.com platform.claude.com auth.x.ai accounts.x.ai cli-chat-proxy.grok.com
http_access allow CONNECT TLS account_services
http_access deny all
cache deny all
access_log none
cache_store_log none
cache_log /dev/null
pid_filename /tmp/squid.pid
coredump_dir /tmp
