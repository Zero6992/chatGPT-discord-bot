# CONNECT only to official inference origins. No request or access logging.
http_port 3128
acl CONNECT method CONNECT
acl TLS port 443
acl inference dstdomain api.openai.com api.anthropic.com api.x.ai
http_access allow CONNECT TLS inference
http_access deny all
cache deny all
access_log none
cache_store_log none
cache_log /dev/null
pid_filename /tmp/squid.pid
coredump_dir /tmp
